name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Dependency audit (high and critical)
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Search and cache performance
        run: npm run test:performance

      - name: Functions build
        run: npm run functions:build

      - name: Production build
        run: npm run build

      - name: PWA artifact gate
        run: npm run verify:pwa:build

      - name: JavaScript budget gate
        run: npm run verify:performance:build

      - name: Safe configuration browser tests
        run: npm run test:e2e

      - name: Phase 17 emulator and production journey
        run: npm run test:acceptance:emulator
